# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
#
# Review settings for the CodeRabbit GitHub app and the local `coderabbit review`
# CLI, which reads this file from the repository root. CodeRabbit also reads
# AGENTS.md as coding guidelines, so these instructions cover the workspace-wide
# rules that live outside this repository and the checks that matter most.
language: en-US
tone_instructions: >-
  Be brief and concrete. Lead with frame-rate, legibility, and book-realism
  problems. Skip formatting nits that swift-format already enforces.

reviews:
  profile: chill
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false

  # Generated, bundled, or binary content. Excluding it keeps reviews (and the
  # trial's rate limit) on source code.
  path_filters:
    - "!**/DerivedData*/**"
    - "!.local/**"
    - "!Bookworms.xcodeproj/**" # Generated by XcodeGen from project.yml.
    - "!**/*.lzfse" # Font glyph atlas built by script/spine-font-atlas.sh.
    - "!**/*.xcassets/**"
    - "!**/*.icon/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.heic"
    - "!**/*.mov"
    - "!**/*.mp4"
    - "!**/*.usdz"
    - "!**/[Rr]enders/**"
    - "!**/[Kk]eepsakes/**"

  path_instructions:
    - path: "**/*.swift"
      instructions: |
        Frame rate: every screen must hold 60 fps or better on every device. Flag:
        - Networking, decoding, image analysis, sorting, text measurement, Keychain access, or file I/O in a SwiftUI `body`, a gesture or scroll handler, or other main-actor code that runs during interaction.
        - Allocations, collection rebuilds, string formatting, or image creation in per-frame code: RealityKit and SceneKit update closures, `TimelineView`, `Canvas`, display links, and animation callbacks.
        - New timers, blur layers, `drawingGroup`, animated shadow radii, offscreen rendering, or rasterization without a stated reason.
        - Caches or task handles in observed state, broad `@Observable` dependencies that invalidate large view trees, and unstable `ForEach` identity.
        - A `Task {}` assumed to leave the main actor, missing cancellation, and stale async results that can replace newer state.
        - Animations or "delight" effects that delay input, navigation, or the next interaction.

        Legibility: flag hard-coded font sizes that ignore Dynamic Type or fall below 11 pt, and text colors likely to miss WCAG 4.5:1 contrast (3:1 for large text) against their background. Pairs and sets of colors should complement each other.

        Platform: guard iOS-only and macOS-only APIs with `#if os(iOS)` or `#if os(macOS)`; add missing UIKit members to `Support/AppKitBridge.swift` instead of forking drawing code. Use Swift 6 strict concurrency with explicit isolation.

        Privacy: Hardcover access stays read-only. Hardcover tokens and provider API keys stay in this device's Keychain and are never synced, uploaded, logged, or added to fixtures.

    - path: "Bookworms/**/*.swift"
      instructions: |
        Spine fonts: never choose, rank, prompt a model for, fall back to, download, or render Impact or any italic, oblique, or slanted face on a spine. Check catalogs and rankers, model prompts and schemas, fallbacks, downloaded faces (reject the italic trait or a nonzero slant), and designs and series looks decoded from storage or iCloud, which must map blocked families through `SpineFamily.uprightReplacement(for:)` (`SpineDesignV1.withAllowedFont`) at the design's weight without rewriting stored records. A face installed on the device and named by a look's `fontPostScriptName` must be upright too.

        3D books: spines are flat cloth with nearly square corners; flag curved, bulging, or rounded spine geometry. Stacked books lie flat on the book below with level top and bottom edges: flag roll in the screen's plane, gaps, overlaps, floating, or leaning on nothing. A stack's imperfection is only small sideways offsets and a few degrees of yaw. A book pulled from a stack moves straight out along the direction its spine faces. Spines keep the app's book proportions; never squash them toward squares to fit more. Thick spines use their extra height for larger or two-line titles before any title is truncated.

        Model tiers: each run designs with the best tier available when it starts (`BookAnalyzer.bestStatus(pcc:backup:onDevice:)`): Private Cloud Compute, the reader's backup model, Apple's on-device model, then local defaults with no model. Flag a run that leaves Private Cloud Compute over its daily limit instead of waiting for the reset, code that creates `PrivateCloudComputeLanguageModel` in `NO_PCC` builds, Private Cloud Compute designing without image input, a backup model's lasting rejection (a key, model name, or account without credit) treated as a busy model or a single book's failure, a design or series look whose `provenance` loses or misstates its tier's model token (`ModelStatus.provenance`, `SpineDesignV1.modelToken`), a save or upgrade that replaces the reader's colors or an edited look, a look upgraded from a series copy (`SpineDesignV1.isSeriesReuse`) instead of a book's own design, and local defaults that offer rounded faces outside the young adult and middle grade genres or skip the glyph and contrast checks. `BookAnalyzer.genreFamilies(_:)` mirrors the tvOS app's `BookWallLocalSpine.fontName(for:)`; flag changes to its genre order or matching without a matching tvOS change.

        Series: a book's style series is the series its `SeriesLinkV1` names, else its shortest Hardcover series (`SeriesDesigns.styleSeries`). Books with one look key (the style series, the Discworld `subseries` group when the style series is Discworld, and the first author: `SeriesDesigns.lookKey`) form a look group. The group's first saved `SeriesLookV1` decides how its books draw: devices only create a missing look (`SpineStore.createLook`) and use the one another device saved first, and only reader edits, requested redesigns, and a better model tier's upgrade of a look the reader never edited (`SeriesLookV1.isUpgraded(at:)`, `SpineStore.upgradeLook`) replace it. A book whose link sets `ownLook` draws its own design. A group without a look draws by rank (`SeriesDesigns.sources`: the lowest style-series position, then the earliest finish, then the lowest ID, from a book that draws its own design). Only a design whose work-item hash is its book's current one lends by rank (`SeriesDesigns.isCurrent`); an out-of-date design draws only its own book. Generation reuses a source by the same rule (`SpineWorker.storedSeriesDesign`). The rank rule judges each design in its allowed upright face (`SpineDesignV1.withAllowedFont`), so a design saved in a blocked face lends its replacement. The catch-up (`SeriesDesigns.missingLooks`) copies only a design whose stored font is allowed and whose work-item hash is the book's current one. A book whose lettering, uppercased when the design is uppercase, the look's or source's loaded face lacks glyphs for keeps its own design; with no face loaded, the check passes. Flag grouping, ranking, or look logic duplicated outside `SeriesDesigns`, and changes to `styleSeries`, `lookKey`, `subseries`, or the series record names without a matching tvOS change. With **Edit** set to **Series**, recolor writes the look, and Change cover and Redesign spine act on the look's source book while it draws the look, else on the book; with **This book**, they act on the book's own design. `seriesID`, `seriesPosition`, and `seriesName` stay Hardcover's featured series for display. Share images use `CloudBook.seriesName` only to shorten titles.

    - path: "Bookworms/Models/CloudContract.swift"
      instructions: |
        This JSON contract must stay compatible with the tvOS repository's `SpineCloudStore.swift`, including `SeriesMembership`, `SeriesLookV1`, `SeriesLinkV1`, and their record names. Flag renamed or removed fields, changed coding keys or defaults, and anything that changes the digests the tests pin without a matching tvOS change.

    - path: "BookwormsTests/**"
      instructions: |
        Tests must be deterministic and use fictional fixtures. Flag live credentials, network calls, paid AI requests, or data from the private preview library.

  tools:
    swiftlint:
      enabled: false # The repository uses swift-format (.swift-format).
